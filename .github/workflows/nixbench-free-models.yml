name: NixBench free-model screens

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: nixbench-free-models
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh-and-screen:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: cachix/install-nix-action@3c6342b75005b9cc7c7d4069c3e9179247c89012
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        with:
          repository: maximilianpw/nixbench
          ref: 290eb8c18d4a0833fcc3746662ff08766102232c
          path: .nixbench-upstream
          persist-credentials: false
      - name: Install OpenCode v2
        run: npm install --global @opencode/cli@2.0.18
      - name: Refresh models.dev and choose one new candidate
        id: candidates
        env:
          NIXBENCH_REVISION: 290eb8c18d4a0833fcc3746662ff08766102232c
        run: |
          cd .nixbench-upstream
          # Three public tasks require /dev/kvm, unavailable on GitHub-hosted runners.
          # Build a transparent task subset with the same pinned corpus manifest.
          python3 - <<'PY'
          from pathlib import Path
          import shutil

          source = Path("tasks")
          target = Path("nixbench-github-hosted")
          excluded = {
              "boot-hook-marker-survives-reboot",
              "firewall-nftables-forwarding-silently-dropped",
              "state-directory-ownership-after-hardening",
          }
          target.mkdir()
          (target / "tasks").mkdir()
          (target / "contracts").mkdir()
          shutil.copy2("corpus.toml", target / "corpus.toml")
          for task in source.iterdir():
              if task.is_dir() and task.name not in excluded:
                  shutil.copytree(task, target / "tasks" / task.name)
                  contract = Path("contracts") / task.name
                  if contract.is_dir():
                      shutil.copytree(contract, target / "contracts" / task.name)
          PY
          python3 bench.py --tasks-dir nixbench-github-hosted/tasks corpus-id --json > "$RUNNER_TEMP/nixbench-corpus.json"
          task_count=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("task_count", 0))' "$RUNNER_TEMP/nixbench-corpus.json")
          cd "$GITHUB_WORKSPACE"
          python3 scripts/nixbench-ranking.py refresh \
            --file data/nixbench-ranking.json \
            --nixbench-revision "$NIXBENCH_REVISION" \
            --corpus-version "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("version", "3.2.0"))' "$RUNNER_TEMP/nixbench-corpus.json")" \
            --corpus-task-count "$task_count" \
            --corpus-digest "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("digest", ""))' "$RUNNER_TEMP/nixbench-corpus.json")"
          model=$(python3 -c 'import json; print(json.load(open("data/nixbench-ranking.json")).get("nextCandidate") or "")')
          if [ -n "$model" ]; then
            printf 'model=%s\n' "$model" >> "$GITHUB_OUTPUT"
          fi
          printf 'task_count=%s\n' "$task_count" >> "$GITHUB_OUTPUT"
      - name: Benchmark the next model
        id: benchmark
        if: steps.candidates.outputs.model != ''
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NIXBENCH_MODEL_ID: ${{ steps.candidates.outputs.model }}
          NIXBENCH_EXPECTED_TASKS: ${{ steps.candidates.outputs.task_count }}
          OPENCODE_CONFIG_DIR: ${{ runner.temp }}/opencode-config
          OPENCODE_HOME: ${{ runner.temp }}/opencode-home
          NIXBENCH_WORKSPACE: ${{ github.workspace }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "No OPENROUTER_API_KEY Actions secret; catalog refreshed, benchmark deferred." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          mkdir -p "$OPENCODE_CONFIG_DIR" "$OPENCODE_HOME"
          chmod 700 "$OPENCODE_CONFIG_DIR" "$OPENCODE_HOME"
          if ! command -v bwrap >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes bubblewrap
          fi
          nix_bin=$(readlink -f "$(command -v nix-instantiate)")
          export NIXBENCH_NIX_BIN_DIR="$(dirname "$nix_bin")"
          sudo install -o root -g root -m 755 \
            "$GITHUB_WORKSPACE/scripts/nixbench-safe-shell.sh" \
            /usr/local/bin/nixbench-safe-shell
          export HOME="$OPENCODE_HOME"
          export NIXBENCH_MODEL_ID
          # Register the exact models.dev candidate in a temporary OpenCode config so a new model
          # does not have to wait for OpenCode's bundled provider catalog to catch up.
          python3 - "$GITHUB_WORKSPACE/templates/nixbench-opencode.json" "$OPENCODE_CONFIG_DIR/opencode.json" "$GITHUB_WORKSPACE/data/nixbench-ranking.json" "$NIXBENCH_MODEL_ID" <<'PY'
          import json, sys
          from pathlib import Path
          template, output, ranking = map(Path, sys.argv[1:4])
          selector = sys.argv[4]
          config = json.loads(template.read_text())
          data = json.loads(ranking.read_text())
          row = next((m for m in data.get("availableModels", []) if m.get("id") == selector), None)
          if row is None:
              raise SystemExit(f"candidate disappeared from catalog: {selector}")
          model_id = selector.removeprefix("openrouter/")
          config["providers"]["openrouter"]["models"][model_id] = {
              "name": row.get("name", model_id),
              "limit": {"context": row.get("contextTokens", 64000), "output": 8192},
              "capabilities": {"tools": True},
          }
          Path(output).write_text(json.dumps(config, indent=2) + "\n")
          PY
          cd .nixbench-upstream
          set +e
          python3 bench.py --tasks-dir nixbench-github-hosted/tasks run-all \
            --agent-cmd "$NIXBENCH_WORKSPACE/scripts/nixbench-agent.sh" \
            --agent-timeout-seconds 900 \
            --model "$NIXBENCH_MODEL_ID" \
            --kind opencode \
            --agent-version "$(opencode --version)" \
            --network enabled \
            --label "OpenCode v2 network-isolated shell screening: $NIXBENCH_MODEL_ID"
          bench_status=$?
          set -e
          summary=$(find results -mindepth 2 -maxdepth 2 -type f -name summary.json -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          cd "$GITHUB_WORKSPACE"
          if [ -n "$summary" ] && python3 scripts/nixbench-ranking.py record \
              --file data/nixbench-ranking.json \
              --model "$NIXBENCH_MODEL_ID" \
              --summary "$GITHUB_WORKSPACE/.nixbench-upstream/$summary" \
              --expected-tasks "$NIXBENCH_EXPECTED_TASKS" \
              --agent-version "$(opencode --version)"; then
            echo "Completed a full one-trial screening run for $NIXBENCH_MODEL_ID (bench exit $bench_status)." >> "$GITHUB_STEP_SUMMARY"
          else
            python3 - "$GITHUB_WORKSPACE/.nixbench-upstream/$summary" <<'PY'
          import json, re, sys
          from pathlib import Path
          summary = Path(sys.argv[1])
          if summary.is_file():
              data = json.loads(summary.read_text())
              for task in data.get("tasks", []):
                  agent = task.get("agent") or {}
                  print(f"NixBench diagnostic {task.get('task_id')}: agent_exit={agent.get('returncode')} timed_out={agent.get('timed_out')} measurement={task.get('measurement_status')} reason={task.get('invalid_reason')}")
                  log = summary.parent / task.get("task_id", "") / "agent.log"
                  if log.is_file():
                      for line in log.read_text(errors="replace").splitlines():
                          if re.search(r"error|denied|failed|401|403|unavailable|invalid|timeout|model", line, re.I):
                              print("Agent diagnostic:", line[-400:])
          PY
            python3 scripts/nixbench-ranking.py failed --file data/nixbench-ranking.json --model "$NIXBENCH_MODEL_ID"
            echo "NixBench did not produce a full, valid task summary for $NIXBENCH_MODEL_ID; the model was not ranked." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Commit refreshed model data
        if: always() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nixbench-ranking.json
          if git diff --cached --quiet; then
            echo "No model catalog or ranking changes."
          else
            git commit -m "Refresh free model catalog and NixBench screening data"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
